version: '3.8'
services:
  deluge-modern:
    build: .
    container_name: deluge-modern
    ports:
      - "8112:8112"
      - "58846:58846"
      - "58946:58946"
      - "58946:58946/udp"
    volumes:
      - ./data/config:/config
      - ./data/downloads:/downloads
    environment:
      - DELUGE_WEB_UI=modern
      - PUID=1000
      - PGID=1000
    restart: unless-stopped

  frontend-dev:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "3000:3000"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    profiles: ["dev"]
    depends_on:
      - deluge-modern
