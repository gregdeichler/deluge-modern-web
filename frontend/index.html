<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
    <meta name="theme-color" content="#09090b"/>
    <meta name="apple-mobile-web-app-capable" content="yes"/>
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
    <title>Deluge Modern</title>
    <script>
      // Apply the persisted theme before first paint to avoid a flash.
      // Mirrors the zustand persist key/shape in src/stores/torrents.ts.
      try {
        var s = JSON.parse(localStorage.getItem('deluge-modern-store') || '{}');
        var t = s && s.state && s.state.theme;
        if (t !== 'light') document.documentElement.classList.add('dark');
      } catch (e) { document.documentElement.classList.add('dark'); }
    </script>
  </head>
  <body class="bg-white text-zinc-900 dark:bg-zinc-950 dark:text-zinc-100"><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
