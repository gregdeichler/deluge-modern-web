name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: BUILD_SHA="$GITHUB_SHA" npm run build
      - name: Package static site
        run: |
          tar -C ../deluge_modern_web/data/dist -czf ../deluge-modern-web-static.tgz .
          shasum -a 256 ../deluge-modern-web-static.tgz > ../deluge-modern-web-static.tgz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: deluge-modern-web-static-${{ github.sha }}
          path: |
            deluge-modern-web-static.tgz
            deluge-modern-web-static.tgz.sha256
          if-no-files-found: error
